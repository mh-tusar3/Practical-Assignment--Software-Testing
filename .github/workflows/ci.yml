name: CI

on:
  push:                      # every push, on every branch
  pull_request:
    branches: [main]         # every pull request into main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ 1. test
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run all tests, fail below 100% line + branch coverage of target.py
        run: >
          pytest
          --cov=target --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --cov-fail-under=100
          --junitxml=junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- 2. deploy
  deploy:
    needs: test                       # the gate: only runs if every test job passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:                      # never run two production deploys at once
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}
    steps:
      - name: Trigger Render deploy of this exact commit
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set"; exit 1
          fi
          # The hook URL already contains ?key=..., so the commit is appended with &ref=
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}")
          echo "Render answered HTTP $status"
          cat response.json || true
          case "$status" in
            200|201|202) echo "Deploy of ${GITHUB_SHA} requested." ;;
            *) echo "::error::Deploy hook failed (HTTP $status)"; exit 1 ;;
          esac
