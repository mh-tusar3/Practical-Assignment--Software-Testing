# Render Blueprint. Direct auto-deploy is OFF: only the GitHub Actions
# "deploy" job (after all tests pass) triggers a deploy via the deploy hook.
services:
  - type: web
    name: functional-testing
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 30
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
